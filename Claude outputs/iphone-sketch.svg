<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .l{fill:none;stroke:#2B2B2B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .t{fill:none;stroke:#2B2B2B;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
      .d{fill:none;stroke:#8a8a8a;stroke-width:1.2;stroke-dasharray:5 6}
      .lab{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;fill:#2B2B2B;letter-spacing:1.5px}
      .sub{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;fill:#7a7a7a;letter-spacing:.5px}
      .ui{font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,Inter,sans-serif;fill:#2B2B2B}
      .acc{stroke:#D9A400}
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#EEEEEC"/>
  <!-- faint dot grid like a Figma canvas -->
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D6D6D3"/></pattern>
  <rect width="1200" height="1200" fill="url(#g)"/>

  <!-- phone body -->
  <rect x="400" y="160" width="400" height="830" rx="62" class="l"/>
  <rect x="414" y="174" width="372" height="802" rx="50" class="t"/>
  <rect x="540" y="192" width="120" height="34" rx="17" class="l"/>
  <line x1="396" y1="330" x2="396" y2="380" class="l"/><line x1="396" y1="400" x2="396" y2="460" class="l"/><line x1="804" y1="380" x2="804" y2="470" class="l"/>

  <!-- status bar -->
  <text x="452" y="216" class="ui" font-size="17" font-weight="600">9:11</text>
  <path d="M712 214 q10 -10 20 0 M716 218 q6 -6 12 0" class="t"/>
  <rect x="740" y="205" width="24" height="12" rx="3" class="t"/>

  <!-- header -->
  <text x="446" y="290" class="ui" font-size="24" font-weight="700">Utter</text>
  <rect x="670" y="264" width="96" height="36" rx="18" class="l"/>
  <rect x="686" y="276" width="16" height="12" rx="2" class="l acc"/>
  <text x="710" y="288" class="ui" font-size="15">Inbox</text>

  <!-- record button: three rings + mic -->
  <circle cx="600" cy="560" r="96" class="d"/>
  <circle cx="600" cy="560" r="78" class="t"/>
  <circle cx="600" cy="560" r="56" class="l"/>
  <rect x="589" y="532" width="22" height="36" rx="11" class="l acc"/>
  <path d="M578 556 a22 22 0 0 0 44 0 M600 578 v10 M588 590 h24" class="l acc"/>
  <text x="600" y="700" class="ui" font-size="19" text-anchor="middle">Hold to record</text>
  <line x1="510" y1="724" x2="690" y2="724" class="t"/>

  <!-- import card -->
  <rect x="440" y="866" width="320" height="64" rx="16" class="l"/>
  <rect x="462" y="884" width="16" height="26" rx="5" class="l acc"/>
  <line x1="496" y1="890" x2="660" y2="890" class="l"/>
  <line x1="496" y1="908" x2="610" y2="908" class="t"/>
  <path d="M730 890 l8 8 l-8 8" class="l"/>
  <line x1="560" y1="958" x2="640" y2="958" class="l"/>

  <!-- annotations -->
  <g class="t"><path d="M446 296 h-40 l-90 -40"/><path d="M766 282 h60 l70 -40"/>
  <path d="M696 560 h130 l50 -30"/><path d="M510 724 h-90 l-100 60"/>
  <path d="M760 898 h80 l60 40"/><path d="M640 958 l60 60 h120"/></g>
  <text x="140" y="246" class="lab">APP TITLE</text><text x="140" y="266" class="sub">big, bold, left</text>
  <text x="900" y="232" class="lab">INBOX</text><text x="900" y="252" class="sub">every memo, transcribed</text>
  <text x="880" y="514" class="lab">HOLD TO RECORD</text><text x="880" y="534" class="sub">rings pulse while recording</text><text x="880" y="552" class="sub">mic in accent yellow</text>
  <text x="140" y="800" class="lab">HINT</text><text x="140" y="820" class="sub">or import from the watch</text>
  <text x="904" y="944" class="lab">IMPORT FROM WATCH</text><text x="904" y="964" class="sub">transcribe latest recording</text>
  <text x="824" y="1032" class="lab">HOME INDICATOR</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
